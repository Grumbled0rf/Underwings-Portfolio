# ===========================================
# UNDERWINGS TECHNOLOGIES - FULL STACK
# Astro + Self-Hosted Supabase + Admin
# ===========================================

services:
  # ===========================================
  # NGINX - Reverse Proxy & SSL Termination
  # ===========================================
  nginx:
    build: ./nginx
    container_name: underwings-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./apps:/home/deployer/underwings/apps:ro
    depends_on:
      - frontend
      - admin
      - studio
      - kong
      - stalwart
      - webmail
      - krayin
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # ROUNDCUBE - Webmail
  # https://webmail.underwings.org
  # ===========================================
  # ===========================================
  # MJML COMPILER — internal sidecar for mjml_compose Roundcube plugin
  # No host port exposure — only reachable on the underwings-network.
  # ===========================================
  mjml:
    build: ./mjml-compiler
    container_name: underwings-mjml
    restart: always
    networks:
      - underwings-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  webmail:
    image: roundcube/roundcubemail:latest-apache
    container_name: underwings-webmail
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=stalwart
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://stalwart
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_DB_DSN=sqlite:////var/roundcube/db/roundcube.db
      - ROUNDCUBEMAIL_SKIN=underwings
      # strip_domain plugin disabled: Stalwart login name is now the full email,
      # Roundcube must pass the full email unchanged (no stripping).
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve,mjml_compose
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
      - ROUNDCUBEMAIL_ASPELL_DICTS=en
    volumes:
      - ./roundcube/db:/var/roundcube/db
      - ./roundcube/config:/var/roundcube/config
      - ./roundcube/config/custom.php:/var/www/html/config/custom.php:ro
      - ./roundcube/skin:/var/www/html/skins/underwings:ro
      - ./roundcube/skin/watermark.html:/var/www/html/public_html/watermark.html:ro
      - ./roundcube/plugins/mjml_compose:/var/www/html/plugins/mjml_compose:ro
    depends_on:
      stalwart:
        condition: service_healthy
      mjml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # STALWART MAIL SERVER
  # SMTP: 25, 465, 587 | IMAP: 143, 993
  # Admin UI proxied via nginx at /mail-admin/
  # ===========================================
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: underwings-mail
    hostname: mail.underwings.org
    ports:
      - "25:25"    # SMTP (inbound from internet)
      - "465:465"  # SMTPS submission (implicit TLS)
      - "587:587"  # SMTP submission (STARTTLS)
      - "143:143"  # IMAP
      - "993:993"  # IMAPS (implicit TLS)
    volumes:
      - ./stalwart/config:/opt/stalwart/etc
      - ./stalwart/data:/opt/stalwart/data
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TZ=Asia/Dubai
      # Initial admin credentials — change after first login
      - STALWART_FALLBACK_ADMIN=${MAIL_ADMIN_USER:-admin}
      - STALWART_FALLBACK_ADMIN_PASS=${MAIL_ADMIN_PASS}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind ports < 1024
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/25' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # FRONTEND - Astro Static Site
  # ===========================================
  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
        - PUBLIC_SUPABASE_URL=http://kong:8000
        - PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
    container_name: underwings-frontend
    environment:
      - PUBLIC_SUPABASE_URL=http://kong:8000
      - PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
      - PUBLIC_SITE_URL=${SITE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      # Krayin CRM integration — legacy direct path (kept for backward compat,
      # new forms should use the n8n inbound webhook below)
      - KRAYIN_WEBHOOK_URL=http://krayin/webhook-contact.php
      - KRAYIN_WEBHOOK_TOKEN=${KRAYIN_WEBHOOK_TOKEN}
      # n8n inbound lead capture (Phase 1)
      - N8N_INBOUND_URL=http://n8n:5678/webhook/inbound-lead
      - N8N_INBOUND_TOKEN=${INBOUND_WEBHOOK_TOKEN}
      # Keila newsletter integration
      - KEILA_API_URL=${KEILA_API_URL}
      - KEILA_API_KEY=${KEILA_API_KEY}
      # SMTP for welcome / contact emails (auth fix — full email username required by Stalwart)
      - SMTP_HOST=stalwart
      - SMTP_USER=newsletter@underwings.org
      - SMTP_PASS=Newsletter@1415!
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # ADMIN - Custom Dashboard
  # ===========================================
  admin:
    build: ./admin
    container_name: underwings-admin
    environment:
      - SUPABASE_URL=${ADMIN_SUPABASE_URL:-http://localhost:8080}
      - SUPABASE_ANON_KEY=${ANON_KEY}
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # SUPABASE STACK
  # ===========================================

  # PostgreSQL Database
  db:
    image: supabase/postgres:15.1.1.61
    container_name: underwings-db
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./supabase/volumes/db/data:/var/lib/postgresql/data
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - underwings-network

  # Kong API Gateway
  kong:
    image: kong:2.8.1
    container_name: underwings-kong
    entrypoint: /var/lib/kong/kong-entrypoint.sh
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml.template:ro
      - ./supabase/kong-entrypoint.sh:/var/lib/kong/kong-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # GoTrue - Authentication
  auth:
    image: supabase/gotrue:v2.143.0
    container_name: underwings-auth
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL},${ADMIN_URL}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: stalwart        # internal → Stalwart container
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_MAILER_URLPATHS_INVITE: ${SITE_URL}/auth/confirm
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${SITE_URL}/auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${SITE_URL}/auth/reset-password
    depends_on:
      db:
        condition: service_healthy
      stalwart:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # PostgREST - RESTful API
  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: underwings-rest
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # Realtime - WebSocket subscriptions
  realtime:
    image: supabase/realtime:v2.25.50
    container_name: underwings-realtime
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:4000/"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # Storage API
  storage:
    image: supabase/storage-api:v0.46.4
    container_name: underwings-storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
    volumes:
      - ./supabase/volumes/storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    restart: always
    networks:
      - underwings-network

  # Meta - Database metadata
  meta:
    image: supabase/postgres-meta:v0.75.0
    container_name: underwings-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # Supabase Studio - Admin UI
  studio:
    image: supabase/studio:20240422-5cf8f30
    container_name: underwings-studio
    healthcheck:
      test: ["CMD-SHELL", "node -e \"var h=require('http');var r=h.get('http://'+require('os').hostname()+':3000/api/profile',function(s){process.exit(s.statusCode===200?0:1)});r.on('error',function(){process.exit(1)});r.setTimeout(5000,function(){r.destroy();process.exit(1)})\""]
      timeout: 10s
      interval: 15s
      start_period: 10s
      retries: 3
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Underwings Cybersecurity Solutions
      DEFAULT_PROJECT_NAME: Underwings Website
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      LOGFLARE_API_KEY: ""
      LOGFLARE_URL: ""
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    depends_on:
      meta:
        condition: service_started
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # KEILA — Email Marketing & Newsletters
  # mail.underwings.org (reusing listmonk subdomain)
  # ===========================================
  keila:
    image: pentacent/keila:0.19.0
    container_name: underwings-keila
    environment:
      - SECRET_KEY_BASE=${KEILA_SECRET_KEY_BASE}
      - DB_URL=postgres://keila:KeilaUnderwings2026x@db:5432/keila
      - URL_HOST=mailmonk.underwings.org
      - TZ=Asia/Dubai
      - URL_SCHEMA=https
      - URL_PORT=443
      - PORT=4000
      - MAILER_SMTP_HOST=stalwart
      - MAILER_SMTP_PORT=587
      - MAILER_SMTP_FROM_EMAIL=newsletter@underwings.org
      - MAILER_SMTP_USER=newsletter@underwings.org
      - MAILER_SMTP_PASSWORD=Newsletter@1415!
      - MAILER_ENABLE_STARTTLS=true
      - KEILA_USER=admin@underwings.org
      - KEILA_PASSWORD=#Underwings@1415!
      - DISABLE_REGISTRATION=true
      - USER_CONTENT_DIR=/opt/app/uploads
    volumes:
      - keila-uploads:/opt/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # KRAYIN CRM — Open Source Laravel CRM
  # crm.underwings.org
  # ===========================================
  krayin:
    image: webkul/krayin:2.2.0
    container_name: underwings-krayin
    environment:
      - APP_NAME=Underwings CRM
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://crm.underwings.org
      - TZ=Asia/Dubai
      - APP_LOCALE=en
      - APP_CURRENCY=USD
      - DB_CONNECTION=mysql
      - DB_HOST=krayin-db
      - DB_PORT=3306
      - DB_DATABASE=krayin
      - DB_USERNAME=krayin
      - DB_PASSWORD=KrCrmUnderwings2026x
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - WEBHOOK_TOKEN=${KRAYIN_WEBHOOK_TOKEN}
      - MAIL_MAILER=smtp
      - MAIL_HOST=stalwart
      - MAIL_PORT=587
      # SMTP auth: re-use the same Stalwart account the frontend uses.
      # Hardcoded (same pattern as the frontend service above) because
      # SMTP_PASS in .env is for a different account.
      - MAIL_USERNAME=newsletter@underwings.org
      - MAIL_PASSWORD=Newsletter@1415!
      - MAIL_ENCRYPTION=tls
      # Stalwart enforces sender == auth user. Use the same address.
      - MAIL_FROM_ADDRESS=newsletter@underwings.org
      - MAIL_FROM_NAME=Underwings CRM
    volumes:
      - krayin-storage:/var/www/html/storage
      - ./krayin/krayin-nginx.conf:/etc/nginx/conf.d/krayin.conf:ro
      - ./krayin/webhook-contact.php:/var/www/laravel-crm/public/webhook-contact.php:ro
      - ./krayin/webhook-scope.php:/var/www/laravel-crm/public/webhook-scope.php:ro
      - ./krayin/webhook-scope-view.php:/var/www/laravel-crm/public/webhook-scope-view.php:ro
      - ./krayin/webhook-lead-create.php:/var/www/laravel-crm/public/webhook-lead-create.php:ro
      - ./krayin/webhook-lead-update.php:/var/www/laravel-crm/public/webhook-lead-update.php:ro
      - ./krayin/webhook-suppression.php:/var/www/laravel-crm/public/webhook-suppression.php:ro
      - ./krayin/webhook-leads-needing-enrichment.php:/var/www/laravel-crm/public/webhook-leads-needing-enrichment.php:ro
      - ./krayin/webhook-lead-by-email.php:/var/www/laravel-crm/public/webhook-lead-by-email.php:ro
      - ./krayin/webhook-leads-needing-brief.php:/var/www/laravel-crm/public/webhook-leads-needing-brief.php:ro
      - ./krayin/webhook-send-brief.php:/var/www/laravel-crm/public/webhook-send-brief.php:ro
      - ./krayin/webhook-pipeline-stats.php:/var/www/laravel-crm/public/webhook-pipeline-stats.php:ro
      - ./krayin/webhook-send-mail.php:/var/www/laravel-crm/public/webhook-send-mail.php:ro
      - ./krayin/login.blade.php:/var/www/laravel-crm/packages/Webkul/Admin/src/Resources/views/sessions/login.blade.php:ro
      - ./krayin/AppServiceProvider.php:/var/www/laravel-crm/app/Providers/AppServiceProvider.php:ro
      - ./krayin/bootstrap-app.php:/var/www/laravel-crm/bootstrap/app.php:ro
    depends_on:
      krayin-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - underwings-network

  krayin-db:
    image: mariadb:11
    container_name: underwings-krayin-db
    environment:
      MARIADB_ROOT_PASSWORD: KrRootUnderwings2026x
      MARIADB_DATABASE: krayin
      MARIADB_USER: krayin
      MARIADB_PASSWORD: KrCrmUnderwings2026x
    volumes:
      - krayin-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # n8n - Workflow automation @ https://n8n.underwings.org
  # Talks to Krayin MySQL directly on the shared underwings-network
  # (Option C - no Krayin REST API package required).
  # ===========================================
  n8n-db:
    image: postgres:16-alpine
    container_name: underwings-n8n-db
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      TZ: Asia/Dubai
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - underwings-network

  n8n:
    image: n8nio/n8n:latest
    container_name: underwings-n8n
    environment:
      # --- Core ---
      N8N_HOST: n8n.underwings.org
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://n8n.underwings.org
      WEBHOOK_URL: https://n8n.underwings.org/
      GENERIC_TIMEZONE: Asia/Dubai
      TZ: Asia/Dubai
      # --- Behind reverse proxy ---
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      # --- Persistence ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # --- Security ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- Modern executions runner ---
      N8N_RUNNERS_ENABLED: "true"
      # --- Allow $env in Code/HTTP nodes (needed for our token-validation pattern) ---
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- Allow Node built-ins inside Code nodes (needed for HMAC verification) ---
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # --- Workflow shared secrets / config ---
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN}
      KRAYIN_WEBHOOK_TOKEN: ${KRAYIN_WEBHOOK_TOKEN}
      SLACK_CHANNEL_NEW_LEADS: ${SLACK_CHANNEL_NEW_LEADS}
      SLACK_CHANNEL_HOT_LEADS_MANOJ: ${SLACK_CHANNEL_HOT_LEADS_MANOJ}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CALCOM_WEBHOOK_SIGNING_SECRET: ${CALCOM_WEBHOOK_SIGNING_SECRET}
      PLANE_API_TOKEN: ${PLANE_API_TOKEN}
      PLANE_BASE_URL: ${PLANE_BASE_URL}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID}
      # --- Logging ---
      N8N_LOG_LEVEL: info
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336   # 14 days
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      n8n-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - underwings-network

  # ===========================================
  # Cal.com - Self-hosted booking @ https://book.underwings.org
  # Replaces Calendly (free tier had no API). Open-source under AGPL.
  # ===========================================
  cal-com-db:
    image: postgres:16-alpine
    container_name: underwings-calcom-db
    environment:
      POSTGRES_DB: calcom
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD}
      TZ: Asia/Dubai
    volumes:
      - calcom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - underwings-network

  cal-com:
    image: calcom/cal.com:latest
    container_name: underwings-calcom
    environment:
      # --- URLs (must point to the public domain) ---
      NEXT_PUBLIC_WEBAPP_URL: https://book.underwings.org
      NEXTAUTH_URL: https://book.underwings.org/api/auth
      NEXT_PUBLIC_API_V2_URL: https://book.underwings.org/api/v2
      # --- Self-host licensing ---
      NEXT_PUBLIC_LICENSE_CONSENT: "agree"
      CALCOM_TELEMETRY_DISABLED: "1"
      # --- CSRF / SSO host allow-list ---
      ALLOWED_HOSTNAMES: '"book.underwings.org","underwings.org"'
      # --- Auth secrets ---
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY}
      # --- Database ---
      DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@cal-com-db:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@cal-com-db:5432/calcom
      # --- Outbound email via Stalwart ---
      EMAIL_FROM: "no-reply@underwings.org"
      EMAIL_FROM_NAME: "Underwings Booking"
      EMAIL_SERVER_HOST: stalwart
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: newsletter@underwings.org
      EMAIL_SERVER_PASSWORD: "Newsletter@1415!"
      # --- Behind reverse proxy ---
      NODE_ENV: production
      TZ: Asia/Dubai
    depends_on:
      cal-com-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: always
    networks:
      - underwings-network

volumes:
  krayin-db-data:
  krayin-storage:
  keila-uploads:
  n8n-db-data:
  n8n-data:
  calcom-db-data:

networks:
  underwings-network:
    driver: bridge
