# Underwings SKU Catalogue — Single Source of Truth
#
# This file is the authoritative pricing reference for:
#   - Proposal generation (n8n workflow 07-proposal-generator)
#   - Website pricing pages (consumed at build time — see Phase D follow-up)
#   - Internal cost-per-deal tracking
#
# Schema:
#   sku           : kebab-case unique id
#   name          : public-facing service name
#   owner         : 'manoj' | 'nelson' | 'vinoth'
#   pipeline      : Krayin pipeline_id (4 = one-off, 5 = software resale, 6 = subscription)
#   price_range_aed : [min, max] — defensible range based on scope
#   default_aed   : starting point when Claude has no scope detail to vary
#   lead_time_weeks : [min, max]
#   revenue_model : 'fixed' | 'monthly' | 'per-license'
#   template      : filename in templates/proposals/
#
# When you change a price here, the next proposal generated will use the
# new number. Existing in-flight proposals are NOT re-priced.
#
# Last updated: 2026-05-21

skus:

  # ──────────────────────────────────────────────────────────────
  # Offensive Security (Nelson)
  # ──────────────────────────────────────────────────────────────

  - sku: pen-test-web
    name: "Web application penetration test"
    owner: nelson
    pipeline: 4
    price_range_aed: [9000, 32000]
    default_aed: 14000
    lead_time_weeks: [2, 4]
    revenue_model: fixed
    template: pen-test-web.md
    summary: "Manual web app pen test mapped to OWASP Top 10 + ASVS. Authenticated + unauthenticated. Includes 1 retest after fixes."

  - sku: pen-test-network-external
    name: "External network penetration test"
    owner: nelson
    pipeline: 4
    price_range_aed: [15000, 36000]
    default_aed: 22000
    lead_time_weeks: [2, 4]
    revenue_model: fixed
    template: pen-test-network.md
    summary: "External attack-surface assessment + manual exploitation of public-facing services. CVE + zero-day-class checks."

  - sku: pen-test-network-internal
    name: "Internal network penetration test"
    owner: nelson
    pipeline: 4
    price_range_aed: [26000, 52000]
    default_aed: 35000
    lead_time_weeks: [3, 5]
    revenue_model: fixed
    template: pen-test-network.md
    summary: "Assumed-breach internal pen test. Lateral movement, AD escalation, segmentation validation."

  - sku: pen-test-mobile
    name: "Mobile application penetration test"
    owner: nelson
    pipeline: 4
    price_range_aed: [14000, 44000]
    default_aed: 22000
    lead_time_weeks: [3, 5]
    revenue_model: fixed
    template: pen-test-mobile.md
    summary: "Static + dynamic analysis of iOS/Android app, mapped to OWASP MASVS. Reverse engineering, IPC, storage, transport."

  - sku: phishing-simulation
    name: "Phishing simulation campaign"
    owner: nelson
    pipeline: 4
    price_range_aed: [3500, 12000]
    default_aed: 6000
    lead_time_weeks: [2, 3]
    revenue_model: fixed
    template: pen-test-web.md      # generic; refine when usage justifies
    summary: "Targeted phishing campaign with credential capture + landing page metrics. Includes follow-up awareness brief."

  # ──────────────────────────────────────────────────────────────
  # GRC / Compliance (Manoj)
