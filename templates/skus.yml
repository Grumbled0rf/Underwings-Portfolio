  # ──────────────────────────────────────────────────────────────
  # Subscriptions (Pipeline 6)
  # ──────────────────────────────────────────────────────────────

  - sku: ptaas-subscription
    name: "PTaaS — Continuous penetration testing"
    owner: nelson
    pipeline: 6
    price_range_aed: [6000, 6000]
    default_aed: 6000
